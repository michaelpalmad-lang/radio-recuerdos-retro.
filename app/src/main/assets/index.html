<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Radio Recuerdos Retro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Press+Start+2P&family=VT323&family=Bungee&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#120624; --bg2:#2a0b4a; --pink:#ff2a8c; --hot:#ff2a6d; --cyan:#05d9e8; --yellow:#f9c80e;
  --orange:#ff6c11; --lime:#7cff4f; --violet:#9d4edd; --ink:#fff; --muted:#c9b6e8;
  --display:'Bungee', 'Arial Black', Impact, sans-serif;
  --pixel:'Press Start 2P', 'Courier New', monospace;
  --crt:'VT323', 'Courier New', monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;background:var(--bg);color:var(--ink);overflow:hidden;font-family:var(--crt)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}

/* ========== Capa CRT ========== */
.scan{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vignette{position:fixed;inset:0;pointer-events:none;z-index:49;
  background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}

/* ========== Pantalla de carga ========== */
#intro{position:fixed;inset:0;z-index:40;overflow:hidden;display:flex;flex-direction:column;align-items:center;
  background:linear-gradient(#0a0318 0%,#2a0b4a 40%,#8a1460 58%,#ff2a6d 64%,#0e041e 64.2%);
  transition:opacity .7s ease, transform .7s ease}
#intro.out{opacity:0;transform:scale(1.08);pointer-events:none}
#intro .power{position:absolute;inset:0;background:#000;z-index:5;animation:power 1.1s ease-out forwards}
#intro .power::after{content:"";position:absolute;left:0;right:0;top:50%;height:2px;background:#fff;
  box-shadow:0 0 20px #fff;transform:translateY(-50%) scaleX(0);animation:line 1.1s ease-out forwards}
@keyframes power{0%,55%{opacity:1}100%{opacity:0;visibility:hidden}}
@keyframes line{0%{transform:translateY(-50%) scaleX(0)}35%{transform:translateY(-50%) scaleX(1)}55%{transform:translateY(-50%) scaleX(1) scaleY(60)}70%,100%{opacity:0}}
.stars{position:absolute;inset:0 0 40% 0;background-image:
  radial-gradient(1px 1px at 12% 18%,#fff,transparent),radial-gradient(1px 1px at 34% 8%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 72% 14%,#fff,transparent),radial-gradient(1px 1px at 88% 30%,#fff,transparent),
  radial-gradient(1px 1px at 55% 26%,#fff,transparent),radial-gradient(1.5px 1.5px at 20% 38%,#fff,transparent),
  radial-gradient(1px 1px at 64% 40%,#fff,transparent),radial-gradient(1px 1px at 6% 50%,#fff,transparent);
  animation:twinkle 3s ease-in-out infinite alternate}
@keyframes twinkle{from{opacity:.5}to{opacity:1}}
.sun{position:absolute;left:50%;top:64%;width:62vw;height:62vw;max-width:340px;max-height:340px;transform:translate(-50%,-62%);
  border-radius:50%;background:linear-gradient(#ffe940 10%,#ff9a3c 45%,#ff2a8c 85%);
  box-shadow:0 0 60px rgba(255,90,140,.7),0 0 140px rgba(255,42,140,.45);
  -webkit-mask:linear-gradient(#000 0 52%,transparent 52% 55%,#000 55% 62%,transparent 62% 66%,#000 66% 72%,transparent 72% 77%,#000 77% 82%,transparent 82% 88%,#000 88%);
          mask:linear-gradient(#000 0 52%,transparent 52% 55%,#000 55% 62%,transparent 62% 66%,#000 66% 72%,transparent 72% 77%,#000 77% 82%,transparent 82% 88%,#000 88%)}
.floor{position:absolute;left:-50%;right:-50%;top:64%;bottom:0;perspective:200px;perspective-origin:50% 0;overflow:hidden}
.floor::before{content:"";position:absolute;left:0;right:0;top:0;transform:rotateX(55deg);transform-origin:top;
  background:
    repeating-linear-gradient(90deg,rgba(5,217,232,.9) 0 2px,transparent 2px 46px),
    repeating-linear-gradient(0deg,rgba(255,42,140,.9) 0 2px,transparent 2px 46px);
  background-color:#0e041e;animation:grid 1.2s linear infinite;height:300%}
@keyframes grid{to{background-position:0 46px,0 46px}}
.horizon{position:absolute;left:0;right:0;top:64%;height:3px;background:var(--pink);box-shadow:0 0 18px var(--pink),0 0 40px var(--pink)}

.logo{position:relative;z-index:2;margin-top:12vh;text-align:center;line-height:1}
.logo .l1{font-family:'Monoton',var(--display);font-size:clamp(46px,15vw,84px);color:#fff;letter-spacing:.06em;
  text-shadow:0 0 6px #fff,0 0 14px var(--cyan),0 0 28px var(--cyan),0 0 54px var(--cyan);animation:flick 4s infinite}
.logo .l2{font-family:'Pacifico',cursive;font-size:clamp(34px,11vw,60px);color:var(--pink);margin-top:-.15em;transform:rotate(-6deg);
  text-shadow:0 0 6px #fff,0 0 16px var(--pink),0 0 34px var(--pink)}
.logo .l3{display:inline-block;margin-top:.2em;font-family:var(--display);font-size:clamp(40px,14vw,78px);letter-spacing:.08em;
  background:linear-gradient(#e8f6ff 0%,#7fd6ff 45%,#1a1a6e 50%,#ff8ad8 52%,#fff 100%);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px rgba(255,255,255,.4);filter:drop-shadow(3px 4px 0 #1b0636) drop-shadow(0 0 10px rgba(255,42,140,.6))}
@keyframes flick{0%,18%,22%,25%,53%,57%,100%{opacity:1}20%,24%,55%{opacity:.35}}

.cassette{position:relative;z-index:2;margin-top:auto;margin-bottom:5vh;width:min(74vw,320px);aspect-ratio:1.6;
  background:#1d0b33;border:4px solid var(--pink);border-radius:14px;box-shadow:6px 6px 0 var(--cyan),0 0 30px rgba(255,42,140,.5);
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:7% 6% 0}
.cassette .label{width:100%;height:58%;background:linear-gradient(var(--yellow) 0 38%,var(--orange) 38% 52%,var(--yellow) 52%);border-radius:6px;
  display:flex;align-items:center;justify-content:space-around;position:relative}
.cassette .label::before{content:"MIX 80·90";position:absolute;top:6%;left:6%;font-family:var(--pixel);font-size:8px;color:#3a0a5a}
.reel{width:24%;aspect-ratio:1;border-radius:50%;background:#1d0b33;border:3px solid #fff;display:grid;place-items:center;animation:spin 1.4s linear infinite}
.reel::after{content:"";width:40%;aspect-ratio:1;border-radius:50%;background:
  conic-gradient(#fff 0 20deg,transparent 20deg 120deg,#fff 120deg 140deg,transparent 140deg 240deg,#fff 240deg 260deg,transparent 260deg)}
@keyframes spin{to{transform:rotate(360deg)}}
.cassette .tape{position:absolute;bottom:0;left:22%;right:22%;height:18%;background:var(--cyan);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}

.loading{position:relative;z-index:2;margin-bottom:8vh;width:min(80vw,340px);text-align:center}
.loading .txt{font-family:var(--pixel);font-size:10px;color:var(--yellow);letter-spacing:.1em;text-shadow:2px 2px 0 #3a0a5a;margin-bottom:10px}
.loading .txt b{animation:blink 1s steps(1) infinite}
.bar{height:18px;border:3px solid #fff;padding:2px;background:#0e041e;box-shadow:4px 4px 0 var(--pink)}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(90deg,var(--lime) 0 10px,transparent 10px 13px);transition:width .2s steps(4)}
.tap{position:absolute;bottom:2.5vh;left:0;right:0;text-align:center;z-index:2;font-family:var(--crt);font-size:18px;color:var(--muted);opacity:.8}
@keyframes blink{50%{opacity:0}}

/* ========== Reproductor ========== */
#app{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top) + 14px) 18px calc(env(safe-area-inset-bottom) + 14px);
  background:
    radial-gradient(circle at 50% 36%,rgba(255,42,140,.35),transparent 55%),
    linear-gradient(170deg,#1a0636 0%,#2a0b4a 45%,#120624 100%);overflow:hidden}
.memphis{position:absolute;inset:0;pointer-events:none;opacity:.55}
.memphis span{position:absolute;display:block}
.m1{top:9%;left:-14px;width:70px;height:70px;border:6px solid var(--cyan);border-radius:50%;animation:float 7s ease-in-out infinite}
.m2{top:20%;right:6%;width:0;height:0;border-left:22px solid transparent;border-right:22px solid transparent;border-bottom:38px solid var(--yellow);animation:float 6s ease-in-out infinite reverse}
.m3{bottom:28%;left:5%;width:80px;height:20px;background:repeating-linear-gradient(135deg,var(--pink) 0 6px,transparent 6px 12px);animation:float 8s ease-in-out infinite}
.m4{bottom:10%;right:-10px;width:60px;height:60px;background:radial-gradient(var(--lime) 3px,transparent 4px) 0 0/14px 14px;animation:float 9s ease-in-out infinite reverse}
.m5{top:50%;right:4%;width:46px;height:14px;border-top:5px solid var(--violet);border-radius:50%;transform:rotate(-20deg)}
@keyframes float{50%{transform:translateY(-12px) rotate(8deg)}}
.gridfloor{position:absolute;left:-40%;right:-40%;bottom:0;height:34%;perspective:200px;perspective-origin:50% 0;opacity:.45;pointer-events:none}
.gridfloor::before{content:"";position:absolute;inset:0;transform:rotateX(65deg);transform-origin:top;height:300%;
  background:repeating-linear-gradient(90deg,rgba(5,217,232,.8) 0 1px,transparent 1px 40px),repeating-linear-gradient(0deg,rgba(255,42,140,.8) 0 1px,transparent 1px 40px);
  animation:grid2 2.4s linear infinite}
@keyframes grid2{to{background-position:0 40px,0 40px}}

header{position:relative;z-index:2;width:100%;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-family:'Monoton',var(--display);font-size:20px;line-height:1;color:#fff;text-shadow:0 0 8px var(--cyan),0 0 18px var(--cyan)}
.brand small{display:block;font-family:'Pacifico',cursive;font-size:15px;color:var(--pink);text-shadow:0 0 8px var(--pink);margin-top:2px}
.live{display:flex;align-items:center;gap:7px;font-family:var(--pixel);font-size:9px;padding:7px 10px;border:2px solid var(--pink);border-radius:30px;background:rgba(255,42,140,.12);box-shadow:3px 3px 0 var(--cyan)}
.live i{width:9px;height:9px;border-radius:50%;background:#666}
.live.on i{background:var(--pink);box-shadow:0 0 10px var(--pink);animation:blink 1s steps(1) infinite}

.stage{position:relative;z-index:2;margin-top:3.5vh;width:min(74vw,330px);aspect-ratio:1}
.vinyl{position:absolute;top:4%;left:18%;width:92%;aspect-ratio:1;border-radius:50%;
  background:radial-gradient(circle,var(--pink) 0 13%,#111 13.5% 15%,transparent 15%),repeating-radial-gradient(circle,#0c0c0c 0 2px,#1d1d1d 2px 4px);
  box-shadow:0 0 0 2px #000,0 10px 30px rgba(0,0,0,.6);transition:left .6s cubic-bezier(.2,.9,.3,1.2)}
.vinyl::after{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(transparent 0 30deg,rgba(255,255,255,.12) 45deg,transparent 60deg 210deg,rgba(255,255,255,.1) 225deg,transparent 240deg)}
.playing .vinyl{left:34%;animation:spin 2.2s linear infinite}
.sleeve{position:absolute;inset:0;border-radius:6px;overflow:hidden;background:#1d0b33;
  box-shadow:-8px 8px 0 var(--cyan),-8px 8px 0 3px #000,0 0 40px rgba(255,42,140,.55);border:4px solid #fff;transition:transform .5s}
.playing .sleeve{transform:rotate(-2deg)}
.sleeve img{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .5s}
.sleeve img.fade{opacity:0}
.sleeve::after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,rgba(255,255,255,.22),transparent 40%);pointer-events:none}
.sticker{position:absolute;right:-12px;top:-12px;z-index:3;width:64px;height:64px;border-radius:50%;background:var(--yellow);color:#3a0a5a;
  display:grid;place-items:center;text-align:center;font-family:var(--display);font-size:11px;line-height:1.05;transform:rotate(14deg);box-shadow:3px 3px 0 #000}

.info{position:relative;z-index:2;width:100%;margin-top:3.2vh;text-align:center}
.now{font-family:var(--pixel);font-size:9px;color:var(--yellow);letter-spacing:.12em;text-shadow:2px 2px 0 #3a0a5a}
.marquee{margin-top:10px;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.marquee span{display:inline-block;font-family:var(--display);font-size:clamp(20px,6.4vw,28px);line-height:1.15;color:#fff;
  text-shadow:3px 3px 0 var(--pink),0 0 18px rgba(255,42,140,.6)}
.marquee.run span{padding-left:100%;animation:scroll var(--d,12s) linear infinite}
@keyframes scroll{to{transform:translateX(-100%)}}
.artist{margin-top:6px;font-size:24px;color:var(--cyan);text-shadow:0 0 10px rgba(5,217,232,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.eq{position:relative;z-index:2;display:flex;align-items:flex-end;gap:3px;height:34px;margin-top:2.2vh}
.eq b{width:7px;height:4px;background:linear-gradient(to top,var(--lime),var(--yellow) 60%,var(--pink));border-radius:1px;transition:height .25s}
.playing .eq b{animation:bar .9s ease-in-out infinite alternate}
@keyframes bar{0%{height:5px}100%{height:var(--h,30px)}}

.controls{position:relative;z-index:2;display:flex;align-items:center;justify-content:center;gap:24px;margin-top:2.4vh}
.side{width:54px;height:54px;border-radius:14px;background:#1d0b33;border:3px solid var(--cyan);box-shadow:4px 4px 0 var(--pink);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.side:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--pink)}
.side svg{width:26px;height:26px;fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.side.active{border-color:var(--yellow);background:rgba(249,200,14,.15)}
.big{position:relative;width:96px;height:96px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#ff7ab8,var(--pink) 45%,#a3105a);border:4px solid #fff;
  box-shadow:0 7px 0 #5d0a3c,0 0 30px rgba(255,42,140,.7);display:grid;place-items:center;transition:transform .08s,box-shadow .08s}
.big:active{transform:translateY(6px);box-shadow:0 1px 0 #5d0a3c,0 0 20px rgba(255,42,140,.7)}
.big svg{width:40px;height:40px;fill:#fff;filter:drop-shadow(2px 2px 0 #5d0a3c)}
.big .spin{position:absolute;inset:-10px;border-radius:50%;border:4px dashed var(--yellow);opacity:0}
.loading-a .big .spin{opacity:1;animation:spin 1.6s linear infinite}

.vol{position:relative;z-index:2;display:flex;align-items:center;gap:12px;width:min(82vw,360px);margin-top:3vh}
.vol label{font-family:var(--pixel);font-size:9px;color:var(--yellow)}
.vol input{flex:1;-webkit-appearance:none;appearance:none;height:12px;border-radius:6px;border:2px solid #fff;
  background:linear-gradient(90deg,var(--cyan) var(--p,60%),#0e041e var(--p,60%))}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:26px;height:30px;border-radius:4px;background:repeating-linear-gradient(0deg,#ddd 0 3px,#888 3px 5px);border:2px solid #000;box-shadow:2px 2px 0 var(--pink)}

.status{position:relative;z-index:2;margin-top:auto;font-size:21px;color:var(--muted);letter-spacing:.05em;text-align:center}
.status .t{color:var(--lime)}
.status.err .t{color:var(--yellow)}
.blinky{animation:blink 1s steps(1) infinite}

/* Hoja temporizador */
.sheet{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;background:rgba(5,0,15,.6);opacity:0;pointer-events:none;transition:opacity .25s}
.sheet.show{opacity:1;pointer-events:auto}
.sheet .box{width:100%;padding:20px 18px calc(env(safe-area-inset-bottom) + 22px);background:#1d0b33;border-top:4px solid var(--pink);
  box-shadow:0 -6px 0 var(--cyan);transform:translateY(100%);transition:transform .3s cubic-bezier(.2,.9,.3,1.1)}
.sheet.show .box{transform:none}
.sheet h3{font-family:var(--pixel);font-size:11px;color:var(--yellow);margin-bottom:16px;text-align:center}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.opts button{padding:14px 0;border:3px solid var(--cyan);border-radius:10px;font-family:var(--display);font-size:16px;background:#120624;box-shadow:3px 3px 0 var(--pink)}
.opts button:active{transform:translate(3px,3px);box-shadow:none}
.opts .off{border-color:var(--yellow);color:var(--yellow)}
.chip{font-family:var(--crt);font-size:20px;color:var(--yellow)}

.toast{position:fixed;left:50%;bottom:16%;z-index:35;transform:translate(-50%,20px);opacity:0;transition:.3s;font-family:var(--pixel);font-size:10px;
  background:#000;border:2px solid var(--lime);color:var(--lime);padding:10px 14px;box-shadow:4px 4px 0 var(--pink);white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

@media (orientation:portrait) and (max-height:640px){.stage{width:min(62vw,250px);margin-top:2vh}.big{width:80px;height:80px}.eq{display:none}}

/* Aviso para activar notificaciones */
.notif{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top) + 66px);z-index:20;display:none;align-items:center;gap:10px;
  padding:10px 12px;background:#000;border:2px solid var(--yellow);box-shadow:4px 4px 0 var(--pink);font-family:var(--crt);font-size:19px;line-height:1.1}
.notif.show{display:flex;animation:drop .35s ease-out}
@keyframes drop{from{transform:translateY(-14px);opacity:0}}
.notif span{flex:1}
.notif .go{font-family:var(--pixel);font-size:9px;padding:9px 10px;background:var(--yellow);color:#3a0a5a;box-shadow:2px 2px 0 var(--pink)}
.notif .x{font-size:22px;color:var(--muted);padding:0 4px}
@media (orientation:landscape){.notif{left:auto;right:5vw;width:min(46vw,460px);top:3vh}}

/* Control remoto (TV / TV box): resalta el botón seleccionado */
button:focus{outline:none}
button:focus-visible,input:focus-visible{outline:4px solid var(--yellow);outline-offset:6px;filter:drop-shadow(0 0 12px rgba(249,200,14,.8))}
.big:focus-visible{outline-offset:10px}

/* ===== Pantallas horizontales (radios de auto, tablets) ===== */
@media (orientation:landscape){
  #intro .sun{width:56vh;height:56vh}
  .logo{margin-top:5vh}
  .logo .l1{font-size:13vh}
  .logo .l2{font-size:9vh}
  .logo .l3{font-size:12vh}
  .cassette{width:auto;height:27vh;margin-bottom:3vh;padding:2.2vh 2vh 0}
  .cassette .label::before{display:none}
  .loading{margin-bottom:6vh;width:min(50vw,420px)}
  .tap{bottom:1.5vh}

  #app{display:grid;grid-template-columns:auto 1fr;column-gap:5vw;
    grid-template-rows:auto 1fr auto auto auto auto 1fr auto;
    justify-items:center;align-items:center;padding:3vh 5vw}
  header{grid-column:1/-1;grid-row:1}
  .stage{grid-column:1;grid-row:2/9;width:min(40vw,74vh);margin:0}
  .info{grid-column:2;grid-row:3;margin:0;max-width:52vw}
  .eq{grid-column:2;grid-row:4;margin-top:2vh}
  .controls{grid-column:2;grid-row:5;margin-top:2.5vh}
  .vol{grid-column:2;grid-row:6;margin-top:3vh;width:min(42vw,420px)}
  .status{grid-column:2;grid-row:8;margin:0}
  .gridfloor{height:40%}
}
@media (orientation:landscape) and (max-height:480px){
  .eq{display:none}
  .big{width:76px;height:76px}
  .side{width:48px;height:48px}
  .marquee span{font-size:22px}
  .artist{font-size:20px}
}

/* Televisores grandes: agranda textos y botones para verlos desde el sillón */
@media (orientation:landscape) and (min-width:1400px){
  .info,.eq,.controls,.vol{zoom:1.7}
  header,.status{zoom:1.6}
  .notif{zoom:1.5}
}
</style>
</head>
<body>
<div class="scan"></div><div class="vignette"></div>

<!-- ========== Intro ========== -->
<section id="intro">
  <div class="power"></div>
  <div class="stars"></div>
  <div class="sun"></div>
  <div class="floor"></div>
  <div class="horizon"></div>
  <div class="logo">
    <div class="l1">RADIO</div>
    <div class="l2">Recuerdos</div>
    <div class="l3">RETRO</div>
  </div>
  <div class="cassette">
    <div class="label"><div class="reel"></div><div class="reel"></div></div>
    <div class="tape"></div>
  </div>
  <div class="loading">
    <div class="txt" id="ltxt">REBOBINANDO EL CASETE<b>_</b></div>
    <div class="bar"><i id="lbar"></i></div>
  </div>
  <div class="tap">toca para entrar</div>
</section>

<!-- ========== Reproductor ========== -->
<main id="app">
  <div class="gridfloor"></div>
  <div class="memphis"><span class="m1"></span><span class="m2"></span><span class="m3"></span><span class="m4"></span><span class="m5"></span></div>

  <header>
    <div class="brand">RADIO<small>Recuerdos Retro</small></div>
    <div class="live" id="live"><i></i>EN VIVO</div>
  </header>

  <div class="stage">
    <div class="vinyl"></div>
    <div class="sleeve"><img id="cover" alt="Carátula"></div>
    <div class="sticker">80s<br>90s</div>
  </div>

  <div class="info">
    <div class="now">♪ SONANDO AHORA ♪</div>
    <div class="marquee" id="mq"><span id="title">Radio Recuerdos Retro</span></div>
    <div class="artist" id="artist">Clásicos de los 80 y 90</div>
  </div>

  <div class="eq" id="eq"></div>

  <div class="controls">
    <button class="side" id="bSleep" aria-label="Temporizador">
      <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/><path d="M15 3h4l-4 5h4"/></svg>
    </button>
    <button class="big" id="bPlay" aria-label="Reproducir">
      <span class="spin"></span>
      <svg id="icPlay" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
      <svg id="icPause" viewBox="0 0 24 24" style="display:none"><path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/></svg>
    </button>
    <button class="side" id="bShare" aria-label="Compartir">
      <svg viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"/></svg>
    </button>
  </div>

  <div class="vol">
    <label>VOL</label>
    <input type="range" id="vol" min="0" max="100" value="60">
  </div>

  <div class="status" id="status"><span class="t">■ LISTO</span> · <span id="sleepChip"></span>PRESIONA PLAY</div>
</main>

<div class="sheet" id="sheet">
  <div class="box">
    <h3>⏾ APAGAR LA RADIO EN…</h3>
    <div class="opts">
      <button data-m="15">15 min</button><button data-m="30">30 min</button><button data-m="45">45 min</button>
      <button data-m="60">1 hora</button><button data-m="90">1½ hora</button><button data-m="0" class="off">Quitar</button>
    </div>
  </div>
</div>
<div class="notif" id="notif">
  <span>🔔 Activa los avisos de la radio</span>
  <button class="go" id="nGo">ACTIVAR</button>
  <button class="x" id="nX" aria-label="Cerrar">✕</button>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
  var A = window.Android || null;
  var $ = function(id){ return document.getElementById(id); };
  var DEFAULT_COVER = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300">' +
    '<defs><linearGradient id="s" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe940"/><stop offset="1" stop-color="#ff2a8c"/></linearGradient>' +
    '<linearGradient id="b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120624"/><stop offset="1" stop-color="#8a1460"/></linearGradient></defs>' +
    '<rect width="300" height="300" fill="url(#b)"/><circle cx="150" cy="190" r="80" fill="url(#s)"/>' +
    '<rect y="190" width="300" height="110" fill="#0e041e"/>' +
    '<g stroke="#05d9e8" stroke-width="1.5">' +
    [0,1,2,3,4,5].map(function(i){var y=190+Math.pow(1.6,i)*6;return '<line x1="0" x2="300" y1="'+y+'" y2="'+y+'"/>';}).join('') +
    [-6,-4,-2,0,2,4,6].map(function(i){return '<line x1="'+(150+i*6)+'" y1="190" x2="'+(150+i*60)+'" y2="300"/>';}).join('') +
    '</g><line x1="0" x2="300" y1="190" y2="190" stroke="#ff2a8c" stroke-width="3"/>' +
    '<text x="150" y="70" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="38" fill="#fff" stroke="#ff2a8c" stroke-width="1.5">RADIO</text>' +
    '<text x="150" y="108" text-anchor="middle" font-family="Arial Black,Arial" font-weight="900" font-size="24" fill="#05d9e8">RECUERDOS RETRO</text></svg>');

  var state = { playing:false, wants:false, buffering:false, title:"", artist:"", art:"", sleepEnd:0, error:false };
  var started = false;

  /* ---------- Intro ---------- */
  var msgs = ["REBOBINANDO EL CASETE","SOPLANDO EL CARTUCHO","SINTONIZANDO LOS 80","CARGANDO LOS 90","¡LISTO PARA SONAR!"];
  var p = 0, bar = $("lbar"), ltxt = $("ltxt");
  var it = setInterval(function(){
    p += 2 + Math.random()*6;
    if (p > 100) p = 100;
    bar.style.width = p + "%";
    ltxt.firstChild.nodeValue = msgs[Math.min(msgs.length-1, Math.floor(p/21))];
    if (p >= 100) { clearInterval(it); setTimeout(enter, 450); }
  }, 200);
  $("intro").addEventListener("click", function(){ p = 100; });

  function enter(){
    if (started) return;
    started = true;
    $("intro").classList.add("out");
    setTimeout(function(){ $("intro").style.display = "none"; }, 800);
    if (A) A.play(); // arranca la radio al entrar
    state.wants = true; render();
  }

  /* ---------- Ecualizador ---------- */
  var eq = $("eq");
  for (var i = 0; i < 26; i++) {
    var b = document.createElement("b");
    b.style.setProperty("--h", (8 + Math.random()*26).toFixed(0) + "px");
    b.style.animationDelay = (-Math.random()).toFixed(2) + "s";
    b.style.animationDuration = (0.45 + Math.random()*0.6).toFixed(2) + "s";
    eq.appendChild(b);
  }

  /* ---------- Carátula ---------- */
  var cover = $("cover"), curArt = null;
  cover.src = DEFAULT_COVER;
  cover.onerror = function(){ cover.src = DEFAULT_COVER; };
  function setCover(url){
    var u = url || DEFAULT_COVER;
    if (u === curArt) return;
    curArt = u;
    var img = new Image();
    img.onload = function(){ cover.classList.add("fade"); setTimeout(function(){ cover.src = u; cover.classList.remove("fade"); }, 250); };
    img.onerror = function(){ cover.src = DEFAULT_COVER; };
    img.src = u;
  }

  /* ---------- Render ---------- */
  var lastTitle = "";
  function render(){
    var app = $("app");
    app.classList.toggle("playing", !!state.playing);
    app.classList.toggle("loading-a", !!(state.wants && !state.playing));
    $("live").classList.toggle("on", !!state.playing);
    $("icPlay").style.display = state.wants ? "none" : "block";
    $("icPause").style.display = state.wants ? "block" : "none";

    var t = state.title || "Radio Recuerdos Retro";
    if (t !== lastTitle) {
      lastTitle = t;
      var mq = $("mq"), sp = $("title");
      sp.textContent = t;
      mq.classList.remove("run");
      requestAnimationFrame(function(){
        if (sp.scrollWidth > mq.clientWidth) {
          mq.style.setProperty("--d", Math.max(8, t.length * 0.35) + "s");
          mq.classList.add("run");
        }
      });
    }
    $("artist").textContent = state.artist || "Clásicos de los 80 y 90";
    setCover(state.art);

    var st = $("status");
    st.classList.toggle("err", !!state.error && !state.playing);
    var left = sleepLeft();
    var chip = left ? '<span class="chip">⏾ ' + left + '</span> · ' : '';
    var html;
    if (state.playing) html = '<span class="t">● AL AIRE</span> · ' + chip + 'ALTA FIDELIDAD';
    else if (state.wants && state.error) html = '<span class="t blinky">▲ SIN SEÑAL</span> · REINTENTANDO…';
    else if (state.wants) html = '<span class="t blinky">◌ SINTONIZANDO…</span>';
    else html = '<span class="t">■ PAUSA</span> · ' + chip + 'PRESIONA PLAY';
    st.innerHTML = html;
    $("bSleep").classList.toggle("active", !!left);
  }

  function sleepLeft(){
    if (!state.sleepEnd) return "";
    var ms = state.sleepEnd - Date.now();
    if (ms <= 0) return "";
    var m = Math.floor(ms/60000), s = Math.floor((ms%60000)/1000);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }
  setInterval(function(){ if (state.sleepEnd) render(); }, 1000);

  /* Llamado desde la app nativa */
  window.onState = function(s){
    for (var k in s) state[k] = s[k];
    render();
  };
  window.onVolume = function(v){
    var x = Math.round(v*100);
    $("vol").value = x; $("vol").style.setProperty("--p", x + "%");
  };

  /* ---------- Botones ---------- */
  $("bPlay").addEventListener("click", function(){
    if (navigator.vibrate) navigator.vibrate(15);
    state.wants = !state.wants; render();
    if (A) A.toggle();
  });
  var vol = $("vol");
  vol.addEventListener("input", function(){
    vol.style.setProperty("--p", vol.value + "%");
    if (A) A.setVolume(vol.value / 100);
  });
  $("bShare").addEventListener("click", function(){
    var txt = state.title && state.title !== "Radio Recuerdos Retro"
      ? "🎶 Estoy escuchando \"" + state.title + "\"" + (state.artist ? " de " + state.artist : "") + " en Radio Recuerdos Retro 📻✨"
      : "📻✨ Escuchando Radio Recuerdos Retro: clásicos de los 80 y 90.";
    if (A) A.share(txt);
  });
  var sheet = $("sheet");
  $("bSleep").addEventListener("click", function(e){
    sheet.classList.add("show");
    if (e.detail === 0) setTimeout(function(){ sheet.querySelector(".opts button").focus(); }, 50); // abierto con el control
  });
  sheet.addEventListener("click", function(e){ if (e.target === sheet) sheet.classList.remove("show"); });
  Array.prototype.forEach.call(document.querySelectorAll(".opts button"), function(btn){
    btn.addEventListener("click", function(){
      var m = parseInt(btn.getAttribute("data-m"), 10);
      if (A) A.sleep(m);
      state.sleepEnd = m ? Date.now() + m*60000 : 0;
      sheet.classList.remove("show");
      toast(m ? "LA RADIO SE APAGA EN " + (m >= 60 ? (m/60).toString().replace(".5","½") + " H" : m + " MIN") : "TEMPORIZADOR QUITADO");
      render();
    });
  });

  var tt;
  function toast(msg){
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(tt); tt = setTimeout(function(){ t.classList.remove("show"); }, 2200);
  }

  /* ---------- Control remoto: flechas para moverse, OK para elegir ---------- */
  function focusables(){
    var root = sheet.classList.contains("show") ? sheet : $("app").parentNode;
    return Array.prototype.filter.call(root.querySelectorAll("button,input"), function(el){
      if (el.closest("#intro")) return false;
      if (!sheet.classList.contains("show") && el.closest("#sheet")) return false;
      var r = el.getBoundingClientRect();
      return r.width > 0 && r.height > 0;
    });
  }
  var DIRS = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0]};
  document.addEventListener("keydown", function(e){
    if (!started && (e.key === "Enter" || e.key === " ")) { p = 100; return; }
    var d = DIRS[e.key];
    if (!d) return;
    var a = document.activeElement;
    if (a && a.type === "range" && d[0] !== 0) return; // izquierda/derecha mueven el volumen
    var list = focusables();
    if (!list.length) return;
    e.preventDefault();
    if (!a || list.indexOf(a) < 0) { (sheet.classList.contains("show") ? list[0] : $("bPlay")).focus(); return; }
    var ra = a.getBoundingClientRect(), ax = ra.left + ra.width/2, ay = ra.top + ra.height/2, best = null, bs = 1e9;
    list.forEach(function(el){
      if (el === a) return;
      var r = el.getBoundingClientRect(), x = r.left + r.width/2 - ax, y = r.top + r.height/2 - ay;
      var along = x*d[0] + y*d[1];
      if (along <= 4) return;
      var sc = along + (Math.abs(x*d[1]) + Math.abs(y*d[0])) * 2;
      if (sc < bs) { bs = sc; best = el; }
    });
    if (best) best.focus();
  });

  /* ---------- Aviso de notificaciones desactivadas ---------- */
  var notifOn = true, notifHidden = false;
  window.onNotif = function(on){ notifOn = !!on; showNotif(); };
  function showNotif(){
    var hide = notifOn || notifHidden || !started;
    $("notif").classList.toggle("show", !hide);
  }
  $("nGo").addEventListener("click", function(){ if (A) A.openNotifSettings(); });
  $("nX").addEventListener("click", function(){ notifHidden = true; showNotif(); });
  setInterval(showNotif, 1500);

  render();
  if (A) A.refresh();
})();
</script>
</body>
</html>
