name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: gradle assembleRelease --no-daemon -Pbuild=${{ github.run_number }}

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk radio-recuerdos-retro.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Versión 1.${{ github.run_number }}
          files: radio-recuerdos-retro.apk
          make_latest: true

      - name: Copia del APK en la rama apk-build
        run: |
          mkdir /tmp/out
          cp radio-recuerdos-retro.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk-build
          git config user.name github-actions
          git config user.email actions@github.com
          git add radio-recuerdos-retro.apk
          git commit -qm "APK v1.${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
