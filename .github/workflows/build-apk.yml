name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Revisar firma
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          if [ -z "$FIRMA_CLAVE" ]; then
            echo "::error::Falta el secreto FIRMA_CLAVE (Settings > Secrets and variables > Actions)"
            exit 1
          fi

      - name: Compilar
        env:
          FIRMA_CLAVE: ${{ secrets.FIRMA_CLAVE }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon -Pbuild=${{ github.run_number }} 2>&1 | tee build.log

      - name: Mostrar error de compilación
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          grep -E "^e: |error:|What went wrong|Could not|Failed|> " build.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk radio-recuerdos-retro.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Versión 1.${{ github.run_number }}
          files: radio-recuerdos-retro.apk
          make_latest: true

      - name: Copia del APK en la rama apk-build
        run: |
          mkdir /tmp/out
          cp radio-recuerdos-retro.apk /tmp/out/
          cd /tmp/out
          git init -q -b apk-build
          git config user.name github-actions
          git config user.email actions@github.com
          git add radio-recuerdos-retro.apk
          git commit -qm "APK v1.${{ github.run_number }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" apk-build
